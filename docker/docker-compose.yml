##############################################################################
# CockroachDB + Apache Airflow PoC
#
# Demonstrates CockroachDB as a metadata backend for Apache Airflow 3.x.
# All versions are parameterized via .env file — nothing is hardcoded.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f airflow-init   # watch DB initialization
#   open http://localhost:${AIRFLOW_WEBSERVER_PORT:-8080}  # Airflow UI
#
# To tear down:
#   docker compose down -v
##############################################################################

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.2.0}
      AIRFLOW_PYTHON_VERSION: ${AIRFLOW_PYTHON_VERSION:-3.12}
      SQLALCHEMY_COCKROACHDB_VERSION: ${SQLALCHEMY_COCKROACHDB_VERSION:-2.0.3}
      PSYCOPG2_VERSION: ${PSYCOPG2_VERSION:-2.9}
      ASYNCPG_VERSION: ${ASYNCPG_VERSION:-0.30}
  environment: &airflow-env
    # Sync engine (psycopg2)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      cockroachdb://root@cockroachdb:${COCKROACHDB_SQL_PORT:-26257}/${COCKROACHDB_DATABASE:-airflow}?sslmode=disable
    # Set READ COMMITTED isolation via SQLAlchemy engine options.
    # Airflow's scheduler doesn't retry on CockroachDB 40001 serialization errors,
    # so SERIALIZABLE (default) causes crashes under contention.
    AIRFLOW__DATABASE__SQL_ALCHEMY_ENGINE_ARGS: '{"isolation_level": "READ COMMITTED"}'
    # Async engine (asyncpg) — required by Airflow 3.x.
    # Must be set explicitly because Airflow's auto-derivation only knows
    # about postgresql/mysql/sqlite, not cockroachdb.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_ASYNC: >-
      cockroachdb+asyncpg://root@cockroachdb:${COCKROACHDB_SQL_PORT:-26257}/${COCKROACHDB_DATABASE:-airflow}?ssl=disable
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-LocalExecutor}
    AIRFLOW__CORE__LOAD_EXAMPLES: "${AIRFLOW_LOAD_EXAMPLES:-false}"
    # Airflow 3.x moved secret_key from [webserver] to [api]
    AIRFLOW__API__SECRET_KEY: "cockroachdb-airflow-poc-secret-key"
    # LocalExecutor tasks need to reach the API server's execution API.
    # Without this, the forked task subprocess tries http://localhost:8080
    # which doesn't exist inside the scheduler container.
    AIRFLOW__API__BASE_URL: "http://airflow-api-server:8080"
    # Shared JWT signing key for execution API auth between scheduler and API server.
    # Without this, each container auto-generates its own random key, causing
    # "Invalid auth token: Signature verification failed" errors.
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-cockroachdb-airflow-poc-jwt-secret}"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: ${AIRFLOW_LOGGING_LEVEL:-INFO}
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # SimpleAuthManager (default in Airflow 3.x) — users configured via env var
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER:-admin}:admin"
    # Pre-configure the CockroachDB connection for example DAGs
    AIRFLOW_CONN_COCKROACHDB_DEFAULT: "postgresql://root@cockroachdb:${COCKROACHDB_SQL_PORT:-26257}/${COCKROACHDB_DATABASE:-airflow}?sslmode=disable"
  volumes:
    - ../examples/dags:/opt/airflow/dags
    - ../src:/opt/airflow/src
    - ../plugins:/opt/airflow/plugins
    - airflow-logs:/opt/airflow/logs
  depends_on:
    cockroachdb-init:
      condition: service_completed_successfully
  networks:
    - airflow-crdb

services:
  # ---------- CockroachDB ----------
  cockroachdb:
    image: cockroachdb/cockroach:${COCKROACHDB_VERSION:-v25.4.8}
    container_name: crdb-airflow
    hostname: cockroachdb
    command: start-single-node --insecure --advertise-addr=cockroachdb
    ports:
      - "${COCKROACHDB_SQL_PORT:-26257}:26257"
      - "${COCKROACHDB_UI_PORT:-8081}:8080"
    volumes:
      - crdb-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure --execute 'SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      - airflow-crdb

  # ---------- CockroachDB Init (create database + configure) ----------
  cockroachdb-init:
    image: cockroachdb/cockroach:${COCKROACHDB_VERSION:-v25.4.8}
    container_name: crdb-airflow-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Waiting for CockroachDB to be ready..."
        until cockroach sql --insecure --host=cockroachdb:26257 -e "SELECT 1" > /dev/null 2>&1; do
          sleep 1
        done
        echo "CockroachDB is ready. Configuring for Airflow compatibility..."
        cockroach sql --insecure --host=cockroachdb:26257 -e "
          CREATE DATABASE IF NOT EXISTS ${COCKROACHDB_DATABASE:-airflow};

          -- Match PostgreSQL SERIAL behavior for Airflow compatibility
          SET CLUSTER SETTING sql.defaults.serial_normalization = 'sql_sequence';

          -- Enable READ COMMITTED isolation for Airflow compatibility.
          -- Airflow's scheduler loop does not retry on CockroachDB serialization
          -- errors (40001/WriteTooOldError), so SERIALIZABLE causes crashes.
          -- READ COMMITTED avoids these errors while still providing strong guarantees.
          SET CLUSTER SETTING sql.txn.read_committed_isolation.enabled = true;
          ALTER DATABASE ${COCKROACHDB_DATABASE:-airflow} SET default_transaction_isolation = 'read committed';

          -- Create uuid_generate_v7 compatibility function (Airflow 3.x uses this)
          USE ${COCKROACHDB_DATABASE:-airflow};
          CREATE OR REPLACE FUNCTION uuid_generate_v7()
          RETURNS UUID
          LANGUAGE SQL
          AS \$\$ SELECT gen_random_uuid() \$\$;

          -- Note: timestampdiff() is handled by the SQLAlchemy compiler plugin
          -- (plugins/cockroachdb_compat_plugin.py) — no UDF needed.
        "
        echo "Database '${COCKROACHDB_DATABASE:-airflow}' created and configured."
    depends_on:
      cockroachdb:
        condition: service_healthy
    networks:
      - airflow-crdb

  # ---------- Airflow DB Init ----------
  airflow-init:
    <<: *airflow-common
    container_name: crdb-airflow-db-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -o pipefail
        echo "=== CockroachDB + Airflow PoC ==="
        echo "Running airflow db migrate..."
        # CockroachDB DDL visibility note: On a fresh database, metadata.create_all()
        # creates tables via one connection, but the subsequent slot_pool query may
        # use a different connection that hasn't yet seen the schema change.
        # This causes a "relation slot_pool does not exist" error on the first run.
        # A retry always succeeds because the tables are fully committed by then.
        MAX_RETRIES=3
        for attempt in $$(seq 1 $$MAX_RETRIES); do
          echo "Migration attempt $$attempt/$$MAX_RETRIES..."
          if airflow db migrate 2>&1 | tee /opt/airflow/logs/db-migrate-attempt-$$attempt.log; then
            echo "DB migration completed successfully on attempt $$attempt!"
            break
          else
            if [ $$attempt -eq $$MAX_RETRIES ]; then
              echo "ERROR: airflow db migrate failed after $$MAX_RETRIES attempts"
              exit 1
            fi
            echo "Attempt $$attempt failed (expected on fresh CockroachDB). Waiting before retry..."
            sleep 5
          fi
        done
        # Airflow 3.x uses SimpleAuthManager by default.
        # Users are configured via AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS env var.
        # Passwords are auto-generated and written to:
        #   $AIRFLOW_HOME/simple_auth_manager_passwords.json.generated
        # They are also printed to the api-server logs on first startup.
        echo ""
        echo "=== Initialization complete ==="
        echo "NOTE: Airflow 3.x uses SimpleAuthManager."
        echo "  Username: ${AIRFLOW_ADMIN_USER:-admin} (role: admin)"
        echo "  Password: check api-server logs or"
        echo "    \$AIRFLOW_HOME/simple_auth_manager_passwords.json.generated"
    restart: "no"

  # ---------- Airflow API Server (new in Airflow 3.x) ----------
  airflow-api-server:
    <<: *airflow-common
    container_name: crdb-airflow-api-server
    command: api-server
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------- Airflow Scheduler ----------
  airflow-scheduler:
    <<: *airflow-common
    container_name: crdb-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------- Airflow DAG Processor (new in Airflow 3.x) ----------
  airflow-dag-processor:
    <<: *airflow-common
    container_name: crdb-airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------- Airflow Triggerer ----------
  airflow-triggerer:
    <<: *airflow-common
    container_name: crdb-airflow-triggerer
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  crdb-data:
  airflow-logs:

networks:
  airflow-crdb:
    driver: bridge
